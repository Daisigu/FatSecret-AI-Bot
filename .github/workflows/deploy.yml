name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            export NVM_DIR=/root/.nvm
            . "$NVM_DIR/nvm.sh"

            APP_DIR=/opt/fatsecret-voice-bot
            if [[ ! -d "$APP_DIR/.git" ]]; then
              git clone --branch main https://github.com/Daisigu/FatSecret-AI-Bot.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            npm ci --omit=dev

            install -m 644 deploy/fatsecret-voice-bot.service /etc/systemd/system/fatsecret-voice-bot.service
            systemctl daemon-reload
            systemctl enable --now fatsecret-voice-bot.service
            systemctl restart fatsecret-voice-bot.service
